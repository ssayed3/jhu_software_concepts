name: Module 5 Software Assurance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: module3_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d module3_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: module3_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/module3_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Module 5 dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        working-directory: module_5
        run: |
          python -m pylint src --disable=duplicate-code --fail-under=10

      - name: Generate dependency graph
        working-directory: module_5
        run: |
          pydeps src --noshow -T svg -o dependency.svg --max-bacon=2
          test -s dependency.svg

      - name: Run Snyk security scan
        working-directory: module_5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --file=requirements.txt --package-manager=pip

      - name: Run pytest
        working-directory: module_5
        run: |
          python -m pytest
